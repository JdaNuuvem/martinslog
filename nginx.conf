# Configuração do nginx que serve a landing.
#
# Vive no repositório (e não solta na VPS) para que qualquer ambiente que suba
# esta imagem — Coolify, outra VPS, a máquina de alguém — sirva o site com o
# mesmo comportamento.

# ---------------------------------------------------------------------------
# Quem é robô de busca.
#
# Precisa vir antes do server. Bloquear robô por país tira o site do Google em
# poucos dias, e ninguém liga um bloqueio esperando perder a indexação.
#
# A verificação é pelo texto do navegador, que qualquer um pode imitar. É
# suficiente de propósito: quem se disfarça de robô ganha acesso a uma página
# PÚBLICA de marketing, não a dado nenhum. Confirmar por DNS reverso custaria
# uma consulta de rede em toda requisição para impedir algo que não causa dano.
# ---------------------------------------------------------------------------
map $http_user_agent $eh_robo {
  default 0;
  ~*googlebot 1;
  ~*bingbot 1;
  ~*duckduckbot 1;
  ~*yandexbot 1;
  ~*baiduspider 1;
  ~*applebot 1;
  ~*facebookexternalhit 1;
  ~*whatsapp 1;
  ~*twitterbot 1;
  ~*linkedinbot 1;
  ~*telegrambot 1;
  ~*slackbot 1;
  ~*uptimerobot 1;
}

# Quem vê a página de "atendemos apenas o Brasil": não é do Brasil E não é robô.
map "$pais_visitante:$eh_robo" $barrar_por_pais {
  default 0;
  "fora:0" 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ---------------------------------------------------------------------------
  # O IP REAL DO VISITANTE.
  #
  # Sem este bloco, `$remote_addr` é o IP do Traefik na rede interna do Docker
  # — igual para todo mundo. O bloqueio por país passaria a tratar TODOS os
  # visitantes como o mesmo endereço, e a lista de faixas viraria decoração.
  #
  # As faixas abaixo são as privadas do Docker e da rede local: só um proxy
  # dentro delas pode dizer quem é o cliente. Confiar em qualquer origem
  # permitiria que um visitante de fora mandasse o cabeçalho dizendo ser
  # brasileiro — e o bloqueio cairia com uma linha de curl.
  #
  # `real_ip_recursive on` desconta os proxies encadeados da direita para a
  # esquerda até sobrar o cliente. Sem isso, com mais de um proxie na frente, o
  # IP tomado seria o do proxy vizinho.
  # ---------------------------------------------------------------------------
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # A página de aviso e os arquivos que ela usa precisam ser servidos a quem
  # está barrado — senão ela carregaria sem estilo, ou pediria a si mesma em
  # laço.
  location = /fora-do-brasil.html {
    internal;
  }

  # Sem isto, o navegador segura o CSS e o JS antigos depois de cada
  # publicação e a correção "não aparece" para quem já visitou o site.
  location ~* \.(css|js)$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Imagens e fontes são versionadas pelo nome do arquivo: podem ficar em
  # cache por muito tempo sem risco de servir conteúdo velho.
  location ~* \.(png|webp|jpg|jpeg|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    # 451 e não 403: a recusa é por região de atendimento, não por falta de
    # permissão. O código diz a verdade a quem lê log.
    if ($barrar_por_pais) {
      return 451;
    }
    try_files $uri $uri/ =404;
  }

  # O corpo que acompanha o 451. `internal` impede que alguém peça a página
  # diretamente e ela apareça para quem NÃO está barrado.
  error_page 451 /fora-do-brasil.html;

  # Compressão: a página tem bastante texto e SVG embutido.
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}
