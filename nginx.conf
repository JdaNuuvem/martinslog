# Configuração do nginx que serve a landing.
#
# Vive no repositório (e não solta na VPS) para que qualquer ambiente que suba
# esta imagem — Coolify, outra VPS, a máquina de alguém — sirva o site com o
# mesmo comportamento.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Sem isto, o navegador segura o CSS e o JS antigos depois de cada
  # publicação e a correção "não aparece" para quem já visitou o site.
  location ~* \.(css|js)$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Imagens e fontes são versionadas pelo nome do arquivo: podem ficar em
  # cache por muito tempo sem risco de servir conteúdo velho.
  location ~* \.(png|webp|jpg|jpeg|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # Compressão: a página tem bastante texto e SVG embutido.
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;
}
